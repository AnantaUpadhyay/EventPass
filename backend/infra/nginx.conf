events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
  upstream auth { server auth:5001; }
  upstream catalog { server catalog:5002; }
  upstream booking { server booking:5003; }
  upstream notifications { server notifications:5004; }
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req_status 429;
    location /api/events { rewrite ^/api/events(.*)$ /api/catalog/events$1 break; proxy_pass http://catalog; }
    location /api/book/ { rewrite ^/api/book/(.*)$ /api/booking/$1 break; proxy_pass http://booking; }
    location /api/auth { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://auth; }
    location /api/catalog { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://catalog; }
    location /api/booking { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://booking; }
    location /api/notifications { proxy_pass http://notifications; }
    location /api/ { default_type application/json; return 404 '{"error":"Endpoint not found."}'; }
    location /internal/ { return 404; }
    location /health { default_type application/json; return 200 '{"service":"nginx-gateway","status":"UP"}'; }
    location /api/system {
      default_type application/json;
      return 200 '{"gateway":"nginx-round-robin","services":[],"note":"Use the refresh checks to probe service endpoints."}';
    }
    location ~ ^/api/health/(auth|catalog|booking|notifications)$ { proxy_pass http://$1/health; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
